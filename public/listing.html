<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Listing // BlackVault</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="/"><span class="logo">☠</span> BLACKVAULT</a>
    <nav><a href="/">MARKET</a><a href="/orders.html">ORDERS</a></nav>
    <div class="userbox" id="userbox"></div>
  </div>
</header>

<main class="wrap narrow" id="root">
  <div class="loading">loading…</div>
</main>

<script src="/js/app.js"></script>
<script src="/js/gate.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const root = document.getElementById('root');
  if (!id) { root.innerHTML = '<div class="empty">// missing listing id</div>'; return; }

  const me = await fetch('/api/me').then(r => r.ok ? r.json() : null).catch(() => null);
  document.getElementById('userbox').innerHTML = me?.user
    ? `<span class="handle">${me.user.handle}</span><span class="bal">$${me.user.balance.toFixed(2)}</span>`
    : `<a href="/login.html" class="btn btn-ghost">SIGN IN</a>`;

  const r = await fetch('/api/listings/' + id).then(x => x.json());
  if (r.error) { root.innerHTML = '<div class="empty">// not found</div>'; return; }
  const l = r.listing, reviews = r.reviews || [];
  const esc = window.BV.escapeHtml;

  root.innerHTML = `
    <a class="back" href="/">← BACK TO MARKET</a>
    <div class="listing-detail">
      <div class="detail-main">
        <div class="card-top">
          <span class="cat-badge">${esc(l.cat_name)}</span>
          <span class="region">${esc(l.region || 'WW')}</span>
        </div>
        <h1>${esc(l.title)}</h1>
        ${l.subtitle ? `<p class="subtitle big">${esc(l.subtitle)}</p>` : ''}
        <div class="vendor-row">
          <span>VENDOR <strong>@${esc(l.vendor_handle)}</strong></span>
          <span>EST ${new Date(l.vendor_since + 'Z').toLocaleDateString()}</span>
          <span>★ ${l.rating_avg.toFixed(1)} (${l.rating_count})</span>
          <span>${l.sales} SOLD</span>
          <span>${l.views} VIEWS</span>
        </div>
        <h3>// DESCRIPTION</h3>
        <div class="desc">${esc(l.description).replace(/\n/g,'<br>')}</div>
        <h3>// REVIEWS</h3>
        <div class="reviews">
          ${reviews.length ? reviews.map(v => `
            <div class="review">
              <div class="rv-head">@${esc(v.buyer_handle)} <span class="stars">${'★'.repeat(v.stars)}${'☆'.repeat(5-v.stars)}</span>
                <em>${new Date(v.created_at + 'Z').toLocaleDateString()}</em></div>
              ${v.body ? `<p>${esc(v.body)}</p>` : ''}
            </div>`).join('') : '<p class="muted">// no reviews yet</p>'}
        </div>
      </div>
      <aside class="detail-side">
        <div class="card buycard">
          <div class="price big">$${l.price_usd.toLocaleString()}</div>
          <div class="unit">per ${esc(l.unit)}</div>
          <div class="stock">${l.stock > 0 ? `${l.stock} available` : 'out of stock'}</div>
          <label>QUANTITY
            <input id="qty" type="number" min="1" max="${Math.max(1, l.stock)}" value="1">
          </label>
          <div class="summary">
            <div><span>subtotal</span><strong id="subtotal">$${l.price_usd.toFixed(2)}</strong></div>
            <div><span>escrow fee (5%)</span><strong id="fee">$${(l.price_usd*0.05).toFixed(2)}</strong></div>
            <div class="total"><span>TOTAL</span><strong id="total">$${(l.price_usd*1.05).toFixed(2)}</strong></div>
          </div>
          <button class="btn btn-primary btn-block" id="buyBtn" ${l.stock <= 0 ? 'disabled' : ''}>
            ${l.stock > 0 ? 'BUY WITH ESCROW' : 'OUT OF STOCK'}
          </button>
          <p class="muted small">funds held in escrow until you confirm delivery</p>
        </div>
      </aside>
    </div>
  `;

  const qtyEl = document.getElementById('qty');
  function recalc() {
    const n = Math.max(1, Math.min(l.stock, Number(qtyEl.value) || 1));
    const sub = l.price_usd * n;
    document.getElementById('subtotal').textContent = '$' + sub.toFixed(2);
    document.getElementById('fee').textContent = '$' + (sub * 0.05).toFixed(2);
    document.getElementById('total').textContent = '$' + (sub * 1.05).toFixed(2);
  }
  qtyEl.addEventListener('input', recalc);

  document.getElementById('buyBtn').addEventListener('click', async () => {
    if (!me?.user) { location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search); return; }
    const qty = Math.max(1, Math.min(l.stock, Number(qtyEl.value) || 1));
    const r = await fetch('/api/orders', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ listing_id: l.id, qty })
    }).then(x => x.json());
    if (r.error) { alert(r.error); return; }
    // show payment gate with amount
    await window.BVGate.show(r.payment.amount);
    location.href = '/orders.html?ref=' + r.order.ref;
  });
})();
</script>
</body>
</html>
