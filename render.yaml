services:
  - type: web
    name: blackvault-market
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: PLATFORM_FEE
        value: "0.05"
      - key: BINANCE_WALLET_ADDRESS
        sync: false
      - key: BINANCE_WALLET_LABEL
        value: BlackVault Treasury
      - key: DATA_DIR
        value: /opt/render/project/src/data
